name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B verify

  # Builds public magpern/farfartaxi-web@main (sibling repo). Marked optional until that repo exists.
  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Cross-repo milestones: use the farfartaxi-web branch with the same name if it exists, else main.
      - name: Resolve farfartaxi-web ref
        id: webref
        run: |
          b="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/magpern/farfartaxi-web.git "$b" >/dev/null 2>&1; then echo "ref=$b" >> "$GITHUB_OUTPUT"; else echo "ref=main" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: magpern/farfartaxi-web
          path: farfartaxi-web
          ref: ${{ steps.webref.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: farfartaxi-web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  # Full-stack check: dockerized backend + frontend, API smoke test, then Playwright golden flow at mobile viewports.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:8099
      # Throwaway values for the ephemeral CI stack only.
      TEST_PASSENGER_PASSWORD: e2e-only-passenger-pw-1
      TEST_DRIVER_PASSWORD: e2e-only-driver-pw-1
    steps:
      - uses: actions/checkout@v4
      # Cross-repo milestones: use the farfartaxi-web branch with the same name if it exists, else main.
      - name: Resolve farfartaxi-web ref
        id: webref
        run: |
          b="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/magpern/farfartaxi-web.git "$b" >/dev/null 2>&1; then echo "ref=$b" >> "$GITHUB_OUTPUT"; else echo "ref=main" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: magpern/farfartaxi-web
          path: farfartaxi-web
          ref: ${{ steps.webref.outputs.ref }}
      - name: Start stack
        env:
          WEB_DIR: farfartaxi-web
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: scripts/smoke.sh http://127.0.0.1:8099
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
