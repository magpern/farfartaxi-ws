spring.application.name=farfartaxi-backend

# Console logging (default is stdout; no file appender unless you add logback-spring.xml)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-}] [u=%X{userId:-}] %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.farfartaxi=INFO

# Optional: Spring Boot relaxed binding — set env vars in Docker / systemd, e.g.
#   LOGGING_LEVEL_COM_FARFARTAXI=DEBUG
#   LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG
# Profile application-rpi.properties: SPRING_PROFILES_ACTIVE=rpi (see docker-compose.rpi.yml)

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farfartaxi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taxi_mgmt}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.jwt.secret=${APP_JWT_SECRET:}
# Access token lifetime (default 60 min); long-lived sessions use the rotating refresh cookie (ft_refresh).
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

# Google Sign-In (browser ID token). Public client id; set GOOGLE_CLIENT_ID in production.
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.admin.email=${FARFARTAXI_ADMIN_EMAIL:admin@farfartaxi.local}
app.admin.password=${FARFARTAXI_ADMIN_PASSWORD:}
app.admin.name=${FARFARTAXI_ADMIN_NAME:Farfar Admin}
app.eta.default-kmh=${APP_ETA_DEFAULT_KMH:35}

app.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.vapid.subject=${VAPID_SUBJECT:mailto:admin@farfartaxi.local}

# Driving directions proxy (OSRM). Default: public demo. Override: app.routing.osrm-base-url=https://your-osrm.example Optional: app.routing.osrm-min-interval-ms=400

# Observability: actuator on an internal management port (not proxied by nginx, not published by compose)
management.server.port=${MANAGEMENT_PORT:8090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Rotating refresh token (cookie ft_refresh, HttpOnly, SameSite=Strict, Path=/api/auth)
app.auth.refresh-days=${APP_AUTH_REFRESH_DAYS:90}
app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-grace-seconds=${APP_AUTH_REFRESH_GRACE_SECONDS:30}
