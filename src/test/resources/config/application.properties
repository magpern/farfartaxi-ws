# Tests must never reach SL / Nominatim: unroutable defaults, no startup load.
app.places.sites.load-on-startup=false
app.places.sl.journeyplanner-base-url=http://127.0.0.1:9
app.places.sl.transport-base-url=http://127.0.0.1:9
app.places.nominatim.base-url=http://127.0.0.1:9

# Integration tests log in / register many times from one IP: generous auth limits (RateLimitsIntegrationTest overrides them).
app.ratelimit.auth.register-per-hour=100000
app.ratelimit.auth.login-per-15min=100000
app.ratelimit.auth.login-failed-per-email-15min=100000
app.ratelimit.auth.google-per-15min=100000
app.ratelimit.auth.forgot-per-hour=100000
