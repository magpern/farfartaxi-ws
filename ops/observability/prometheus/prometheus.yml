global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: farfartaxi
    metrics_path: /actuator/prometheus
    scrape_interval: 30s
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/farfartaxi_password
    static_configs:
      - targets: ["192.168.1.151:8090"]
